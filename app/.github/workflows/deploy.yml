name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1380615.hstgr.cloud
          username: root
          port: 2222
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/wantokjobs/app
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/github_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            git fetch origin
            git reset --hard origin/main
            cd client && npm ci --silent && npm run build 2>&1 | tail -3
            cd ..
            systemctl restart wantokjobs
            sleep 3
            curl -sf http://localhost:3001/health > /dev/null && echo "Deploy OK" || echo "Health check failed"
