name: VPS Exec
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on VPS'
        required: true
      run_id_tag:
        description: 'Unique tag to identify this run'
        required: false

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Execute on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1380615.hstgr.cloud
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 5m
          script: |
            echo "=== VPSEXEC_START ==="
            ${{ github.event.inputs.command }}
            echo "=== VPSEXEC_END ==="
