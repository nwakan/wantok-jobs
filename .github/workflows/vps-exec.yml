name: VPS Exec
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on VPS'
        required: true
      run_id_tag:
        description: 'Unique tag'
        required: false

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Execute on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1380615.hstgr.cloud
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 5m
          script: |
            rm -f /tmp/vps_large_output.txt /tmp/vps_cmd_output.txt
            eval "${{ github.event.inputs.command }}" > /tmp/vps_cmd_output.txt 2>&1 || true

      - name: Retrieve output from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1380615.hstgr.cloud
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 2222
          command_timeout: 2m
          script: |
            echo '=== VPSEXEC_OUTPUT_START ==='
            if [ -f /tmp/vps_large_output.txt ]; then
              cat /tmp/vps_large_output.txt
              rm -f /tmp/vps_large_output.txt
            else
              cat /tmp/vps_cmd_output.txt 2>/dev/null || echo no_output
            fi
            echo '=== VPSEXEC_OUTPUT_END ==='
            rm -f /tmp/vps_cmd_output.txt
